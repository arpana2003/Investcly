
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>InvestCly - Latest Business, Technology & Market Updates</title>

    <!-- Primary Meta Tags -->
    <meta name="description" content="DynamicNews provides breaking news, market insights, and in-depth coverage of business, markets, technology, and global trends. Stay informed with real-time updates." />
    <meta name="author" content="DynamicNews Team" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />

    <!-- Canonical -->
    <link rel="canonical" href="http://localhost:5173/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="DynamicNews" />
    <meta property="og:title" content="DynamicNews | Latest Business & Technology Updates" />
    <meta property="og:description" content="Stay ahead with DynamicNews. Get breaking news, insights, and analysis on markets, companies, technology, and global business trends." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://localhost:5173/" />
    <meta property="og:image" content="http://localhost:5173/og-image.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@yourtwitterhandle" />
    <meta name="twitter:title" content="DynamicNews | Latest Business & Technology Updates" />
    <meta name="twitter:description" content="Breaking news and in-depth coverage of business, markets, and technology." />
    <meta name="twitter:image" content="http://localhost:5173/og-image.jpg" />

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Structured Data: Organization + Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NewsMediaOrganization",
      "name": "DynamicNews",
      "url": "http://localhost:5173/",
      "logo": "http://localhost:5173/logo.png",
      "sameAs": [
        "https://twitter.com/yourtwitterhandle",
        "https://www.linkedin.com/company/yourprofile"
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "url": "http://localhost:5173/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "http://localhost:5173/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Optional Performance Boost -->
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com"> -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
